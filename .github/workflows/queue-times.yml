# Relevé des temps d'attente, commité dans donnees/queue-times/.
# Lancé par son déclenchement manuel, que cron-job.org appelle toutes les
# 15 minutes (minutes 4, 19, 34 et 49, de 8 h à 23 h, heure de Paris) : la
# planification de GitHub accuse des heures de retard sur ce compte. Le
# script ne fait aucune requête hors de 8 h – minuit, heure de Paris, ni
# après FIN_COLLECTE.
name: Relevé Queue-Times

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: queue-times
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Relever les deux parcs
        run: python3 scripts/releve_queue_times.py
        env:
          FIN_COLLECTE: "2026-11-12"

      - name: Commiter les relevés
        run: |
          git add donnees/queue-times
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Relevé Queue-Times du $(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M')"
          for essai in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 10
          done
          exit 1
