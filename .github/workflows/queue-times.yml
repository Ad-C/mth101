# Relevé des temps d'attente toutes les 15 minutes, commité dans donnees/queue-times/.
# Les heures sont en UTC et couvrent l'heure d'été comme l'heure d'hiver ; le
# script ne fait aucune requête hors de la plage 8 h 30 - 23 h 45, heure de Paris,
# ni après FIN_COLLECTE.
name: Relevé Queue-Times

on:
  schedule:
    - cron: "4,19,34,49 6-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: queue-times
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Relever les deux parcs
        run: python3 scripts/releve_queue_times.py
        env:
          FIN_COLLECTE: "2026-11-12"

      - name: Commiter les relevés
        run: |
          git add donnees/queue-times
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Relevé Queue-Times du $(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M')"
          for essai in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 10
          done
          exit 1
